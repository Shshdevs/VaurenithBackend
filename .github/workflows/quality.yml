name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaurenith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaurenith_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vaurenith
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vaurenith_test
      AUTH_JWT_ISSUER: https://identity.test.vaurenith
      AUTH_JWT_AUDIENCE: vaurenith-backend-test
      AUTH_JWT_PUBLIC_KEY_PATH: .local/keys/jwt-public.pem
      AUTH_JWT_CLOCK_SKEW_SECONDS: "30"
      AUTH_JWT_MAX_LIFETIME_SECONDS: "3600"
      CORS_ORIGINS: ""
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Generate test JWT public key
        run: |
          python - <<'PY'
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          public_key = key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          key_path = Path(".local/keys/jwt-public.pem")
          key_path.parent.mkdir(parents=True, exist_ok=True)
          key_path.write_bytes(public_key)
          PY
      - run: make db-upgrade-test
      - run: make check
