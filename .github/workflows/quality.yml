name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaurenith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaurenith_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vaurenith
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vaurenith_test
      AUTH_JWT_SECRET: test-secret-for-authentication-32chars
      CORS_ORIGINS: ""
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make db-upgrade-test
      - run: make check
