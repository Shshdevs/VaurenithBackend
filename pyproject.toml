[tool.pyright]
include = ["src", "migrations"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 92
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.bandit]
targets = ["src", "migrations"]
exclude_dirs = [".venv", "tests"]

[tool.commitizen]
name = "cz_customize"
allowed_prefixes = ["Merge", "Revert"]

[tool.commitizen.customize]
example = "chore(dev): automate local development workflows"
schema = "<type>(<scope>): <imperative summary>"
schema_pattern = "^(feat|fix|refactor|test|docs|chore|build|ci|perf|style|revert)\\([a-z][a-z0-9-]*\\): .+$"
info = "Use a lowercase type and scope. Write a concise English imperative summary without a final period."
