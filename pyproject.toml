[tool.pyright]
include = ["src", "migrations"]
extraPaths = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 92
target-version = "py313"
src = ["src"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.infrastructure", "app.api", "app.bootstrap", "app.core"]

[[tool.importlinter.contracts]]
name = "Application is independent of delivery and implementation"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure", "app.api", "app.bootstrap", "app.core"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on delivery or composition"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.bootstrap"]

[[tool.importlinter.contracts]]
name = "API does not depend on implementation or composition"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.infrastructure", "app.bootstrap"]

[[tool.importlinter.contracts]]
name = "Core is independent"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.domain", "app.application", "app.infrastructure", "app.api", "app.bootstrap"]

[[tool.importlinter.contracts]]
name = "Domain features stay independent"
type = "forbidden"
source_modules = [
    "app.domain.synchronization",
    "app.domain.projects",
    "app.domain.infrastructure",
    "app.domain.monitoring",
    "app.domain.preferences",
    "app.domain.identity",
    "app.domain.development",
    "app.domain.automation",
    "app.domain.relations",
]
forbidden_modules = [
    "app.domain.synchronization",
    "app.domain.projects",
    "app.domain.infrastructure",
    "app.domain.monitoring",
    "app.domain.preferences",
    "app.domain.identity",
    "app.domain.development",
    "app.domain.automation",
    "app.domain.relations",
]

[tool.bandit]
targets = ["src", "migrations"]
exclude_dirs = [".venv", "tests"]

[tool.commitizen]
name = "cz_customize"
allowed_prefixes = ["Merge", "Revert"]

[tool.commitizen.customize]
example = "chore(dev): automate local development workflows"
schema = "<type>(<scope>): <imperative summary>"
schema_pattern = "^(feat|fix|refactor|test|docs|chore|build|ci|perf|style|revert)\\([a-z][a-z0-9-]*\\): .+$"
info = "Use a lowercase type and scope. Write a concise English imperative summary without a final period."
