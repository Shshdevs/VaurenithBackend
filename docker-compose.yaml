services:
  postgres:
    image: postgres:17-alpine
    container_name: vaurenith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique PostgreSQL password in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaurenith-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PREFIX: ${API_PREFIX}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  change-log-pruner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaurenith-change-log-pruner
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          if python scripts/purge_expired_change_logs.py; then
            sleep 86400
          else
            sleep 300
          fi
        done
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PREFIX: ${API_PREFIX}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
